<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="PRAFUL YouTube Search - search and watch YouTube videos.">
<title>PRAFUL YOUTUBE</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151e30;--line:#2a3650;--muted:#aab5ca;--accent:#765cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fc;font:15px/1.5 system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b1020ee;border-bottom:1px solid var(--line);padding:15px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand span{color:#9b8aff}
main{max-width:1100px;margin:28px auto;padding:0 16px}
h1{font-size:clamp(25px,4vw,36px);margin:0 0 5px}.intro{color:var(--muted);margin:0 0 20px}
.search{display:flex;gap:9px;background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:16px}
.search input{flex:1;min-width:0;background:#0b1324;border:1px solid var(--line);border-radius:11px;padding:13px;color:white;font-size:16px;outline:none}
button{border:0;border-radius:11px;padding:11px 17px;background:var(--accent);color:white;font-weight:750;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 20px}
.status{color:var(--muted);min-height:24px;margin:14px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}
.player{aspect-ratio:16/9;background:#05070d}.player iframe{width:100%;height:100%;border:0}
.info{padding:12px}.title{font-weight:750;line-height:1.4}.channel,.duration{font-size:13px;color:var(--muted);margin-top:6px}
.more-wrap{text-align:center;padding:24px 0 45px}
@media(max-width:520px){header{padding:12px 15px}.brand{font-size:19px}main{margin:20px auto}.search{padding:9px}.search button{padding:10px 13px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand">▶ PRAFUL <span>YOUTUBE</span></div></header>
<main>
<h1>YouTube Video Search</h1>
<p class="intro">YouTube par jo bhi search karna ho, yahan likhiye.</p>
<form class="search" id="searchForm">
<input id="searchInput" type="search" placeholder="Search anything... e.g. Gujarati comedy, songs, cricket" autocomplete="off" required>
<button id="searchButton" type="submit">Search</button>
</form>
<p class="hint">1 minute se 8 ghante tak ke videos • Search results YouTube se</p>
<div class="status" id="status" role="status">Trending videos load ho rahe hain...</div>
<section class="grid" id="videoGrid"></section>
<div class="more-wrap"><button id="loadMore" type="button" hidden>Load More Videos</button></div>
</main>
<script>
const API = 'https://praful-social-api.bambhaniyapraful7.workers.dev/videos';
const form = document.getElementById('searchForm');
const input = document.getElementById('searchInput');
const statusBox = document.getElementById('status');
const grid = document.getElementById('videoGrid');
const searchButton = document.getElementById('searchButton');
const moreButton = document.getElementById('loadMore');
let currentQuery = 'trending';
let nextPageToken = '';
let loading = false;
let seen = new Set();

function durationText(seconds) {
  const n = Math.max(0, Number(seconds) || 0);
  const h = Math.floor(n / 3600);
  const m = Math.floor((n % 3600) / 60);
  const s = n % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function addVideo(video) {
  if (!video || !video.id || seen.has(video.id)) return false;
  seen.add(video.id);
  const card = document.createElement('article');
  card.className = 'card';
  const player = document.createElement('div');
  player.className = 'player';
  const frame = document.createElement('iframe');
  frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(video.id);
  frame.title = video.title || 'YouTube video';
  frame.loading = 'lazy';
  frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  frame.allowFullscreen = true;
  player.appendChild(frame);
  const info = document.createElement('div');
  info.className = 'info';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = video.title || 'YouTube video';
  const channel = document.createElement('div');
  channel.className = 'channel';
  channel.textContent = video.channel || 'YouTube creator';
  const duration = document.createElement('div');
  duration.className = 'duration';
  duration.textContent = 'Duration: ' + durationText(video.durationSeconds);
  info.append(title, channel, duration);
  card.append(player, info);
  grid.appendChild(card);
  return true;
}
async function searchVideos(query, loadMore=false) {
  if (loading) return;
  if (!loadMore) {
    currentQuery = query.trim() || 'trending';
    nextPageToken = '';
    seen = new Set();
    grid.replaceChildren();
    moreButton.hidden = true;
  }
  if (loadMore && !nextPageToken) return;
  loading = true;
  searchButton.disabled = true;
  moreButton.disabled = true;
  statusBox.textContent = loadMore ? 'Aur videos load ho rahe hain...' : `“${currentQuery}” search ho raha hai...`;
  try {
    let url = API + '?category=' + encodeURIComponent(currentQuery);
    if (loadMore && nextPageToken) url += '&pageToken=' + encodeURIComponent(nextPageToken);
    const response = await fetch(url);
    const data = await response.json();
    if (!response.ok) throw new Error(data.details || data.error || 'YouTube search failed');
    const videos = Array.isArray(data.videos) ? data.videos : [];
    let added = 0;
    videos.forEach(v => { if (addVideo(v)) added++; });
    nextPageToken = data.nextPageToken || '';
    statusBox.textContent = added ? `${added} videos mil gaye. Search: ${currentQuery}` : 'Is search ke liye videos nahi mile. Dusra word search karein.';
    moreButton.hidden = !nextPageToken;
  } catch (err) {
    statusBox.textContent = 'Error: ' + (err.message || 'Videos load nahi hue. Internet/API check karein.');
  } finally {
    loading = false;
    searchButton.disabled = false;
    moreButton.disabled = false;
  }
}
form.addEventListener('submit', e => {
  e.preventDefault();
  searchVideos(input.value);
});
moreButton.addEventListener('click', () => searchVideos(currentQuery, true));
searchVideos('trending');
</script>
</body>
</html>
